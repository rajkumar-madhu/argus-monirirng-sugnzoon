# Minimal Argus community config for Hostinger (shared VPS, Argus-only branding).
# Prefer ARGUS_* env overrides in docker-compose for DSN / external URL.

global:
  external_url: http://213.210.36.154:8089

version:
  banner:
    enabled: false

sqlstore:
  provider: sqlite
  sqlite:
    path: /var/lib/argus/argus.db
    mode: wal

telemetrystore:
  provider: clickhouse
  clickhouse:
    dsn: tcp://clickhouse:9000
    cluster: cluster

apiserver:
  address: 0.0.0.0:8080

web:
  enabled: true
  directory: /etc/argus/web
  index: index.html

instrumentation:
  logs:
    level: info
  metrics:
    enabled: false
  traces:
    enabled: false

pprof:
  enabled: false
