# Minimal Argus community config for the self-hosted VM.
# Override ARGUS_* env vars in docker-compose for DSN / external URL.

global:
  # Set via ARGUS_GLOBAL_EXTERNAL_URL or edit after first boot.

version:
  banner:
    enabled: false

sqlstore:
  provider: sqlite
  sqlite:
    path: /var/lib/argus/argus.db
    mode: wal

telemetrystore:
  provider: clickhouse
  clickhouse:
    dsn: tcp://clickhouse:9000
    cluster: cluster

apiserver:
  address: 0.0.0.0:8080

web:
  enabled: true
  directory: /etc/argus/web
  index: index.html

instrumentation:
  logs:
    level: info
  metrics:
    enabled: false
  traces:
    enabled: false

pprof:
  enabled: false
