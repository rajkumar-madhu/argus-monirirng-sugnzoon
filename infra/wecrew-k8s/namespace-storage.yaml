# Node-local storage: restore data and verify the durable node mount before starting workloads.
apiVersion: v1
kind: Namespace
metadata:
  name: wecrew-monitoring
  labels:
    app.kubernetes.io/part-of: wecrew-monitoring
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: wecrew-monitoring-argus
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: wecrew-monitoring
    name: argus-data
  local:
    path: /var/local/wecrew-monitoring/argus
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [wecrew-control-plane]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: argus-data
  namespace: wecrew-monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: wecrew-monitoring-argus
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolume
