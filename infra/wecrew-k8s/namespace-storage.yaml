    name: clickhouse-data
  local:
    path: /var/local/wecrew-monitoring/clickhouse
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [wecrew-control-plane]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-data
  namespace: wecrew-monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: wecrew-monitoring-clickhouse
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolume
