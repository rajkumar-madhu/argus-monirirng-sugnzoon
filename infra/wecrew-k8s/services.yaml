# NodePorts require collision checks and deliberate host routing before cutover.
apiVersion: v1
kind: Service
metadata:
  name: argus
  namespace: wecrew-monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: argus
    app.kubernetes.io/part-of: wecrew-monitoring
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
      nodePort: 30089
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: wecrew-monitoring
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: wecrew-monitoring
  ports:
    - name: http
      port: 8123
      targetPort: http
      protocol: TCP
    - name: native
      port: 9000
      targetPort: native
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: wecrew-monitoring
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/part-of: wecrew-monitoring
  ports:
    - name: client
      port: 2181
      targetPort: client
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: wecrew-monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: wecrew-monitoring
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
      nodePort: 30317
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
      nodePort: 30318
    - name: health
      port: 13133
      targetPort: health
      protocol: TCP
      nodePort: 30133
