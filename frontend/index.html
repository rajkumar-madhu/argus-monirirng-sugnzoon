<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<base href="[[.BaseHref]]" />
		<meta
			http-equiv="Cache-Control"
			content="no-cache, no-store, must-revalidate, max-age: 0"
		/>
		<meta http-equiv="Pragma" content="no-cache" />
		<meta http-equiv="Expires" content="0" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="preconnect" href="https://cdn.vercel.com" crossorigin />

		<link
			href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
			rel="stylesheet"
		/>

		<title data-react-helmet="true">
			Open source Observability platform | WeCrew
		</title>
		<meta
			data-react-helmet="true"
			property="og:title"
			content="Open source Observability platform | WeCrew"
		/>
		<meta
			data-react-helmet="true"
			name="description"
			content="WeCrew is an open source observability platform to help you find issues in your deployed applications & solve them quickly. It provides a single pane of glass for metrics, traces and logs with deep filtering and aggregation to pin down specific issues very quickly."
		/>
		<meta
			data-react-helmet="true"
			property="og:description"
			content="WeCrew is an open source observability platform to help you find issues in your deployed applications & solve them quickly. It provides a single pane of glass for metrics, traces and logs with deep filtering and aggregation to pin down specific issues very quickly."
		/>
		<meta
			data-react-helmet="true"
			property="og:image"
			content="[[.BaseHref]]wecrew-social.png"
		/>
		<meta
			data-react-helmet="true"
			name="twitter:image"
			content="[[.BaseHref]]wecrew-social.png"
		/>
		<meta
			data-react-helmet="true"
			name="twitter:image:alt"
			content="Illustrative WeCrew telemetry flow connecting traces, metrics, and logs"
		/>
		<meta
			data-react-helmet="true"
			name="twitter:card"
			content="summary_large_image"
		/>
		<meta data-react-helmet="true" name="docusaurus_locale" content="en" />
		<meta data-react-helmet="true" name="docusaurus_tag" content="default" />
		<meta name="robots" content="noindex" />
		<meta name="theme-color" content="#faf8f3" />
		<meta name="color-scheme" content="light" />
		<link rel="manifest" href="manifest.json" />
		<link data-react-helmet="true" rel="icon" type="image/svg+xml" href="wecrew-mark.svg" />
	</head>
	<body data-theme="default">
		<script>
			// Apply the product's light-only theme before React renders.
			document.body.classList.remove('dark', 'darkMode');
			document.body.classList.add('lightMode');
			document.documentElement.style.colorScheme = 'light';
		</script>
		<script type="application/json" id="argus-boot-settings">
			[[.Settings]]
		</script>
		<script>
			try {
				var _el = document.getElementById('argus-boot-settings');
				window.argusBootData = {
					settings: _el ? JSON.parse(_el.textContent) : null,
				};
			} catch (e) {
				window.argusBootData = { settings: null };
			}
		</script>
		<noscript>You need to enable JavaScript to run this app.</noscript>
		<div id="root"></div>

		<script>
			var pylonSettings =
				((window.argusBootData || {}).settings || {}).pylon || {};
			var pylonEnabled = pylonSettings.enabled === true;
			if (pylonSettings.appId && pylonEnabled) {
				(function () {
					var e = window;
					var t = document;
					var n = function () {
						n.e(arguments);
					};
					n.q = [];
					n.e = function (e) {
						n.q.push(e);
					};
					e.Pylon = n;
					var r = function () {
						var e = t.createElement('script');
						e.setAttribute('type', 'text/javascript');
						e.setAttribute('async', 'true');
						e.setAttribute(
							'src',
							'https://widget.usepylon.com/widget/' + pylonSettings.appId,
						);
						var n = t.getElementsByTagName('script')[0];
						n.parentNode.insertBefore(e, n);
					};
					if (t.readyState === 'complete') {
						r();
					} else if (e.addEventListener) {
						e.addEventListener('load', r, false);
					}
				})();
			}
		</script>
		<script type="text/javascript">
			window.AppcuesSettings = { enableURLDetection: true };
		</script>
		<script>
			var appcuesSettings =
				((window.argusBootData || {}).settings || {}).appcues || {};
			var appcuesEnabled = appcuesSettings.enabled === true;
			if (appcuesSettings.appId && appcuesEnabled) {
				(function (d, t) {
					var a = d.createElement(t);
					a.async = 1;
					a.src = '//fast.appcues.com/' + appcuesSettings.appId + '.js';
					var s = d.getElementsByTagName(t)[0];
					s.parentNode.insertBefore(a, s);
				})(document, 'script');
			}
		</script>
		<script type="module" src="./src/index.tsx"></script>
	</body>
</html>
